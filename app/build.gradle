plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.mahestan.block'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.mahestan.block'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}